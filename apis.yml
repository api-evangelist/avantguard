description: AvantGuard is a Cornell University‑based spin‑out developing antimicrobial technologies to combat Candida auris and other pathogens.
  The company leverages N‑halamine chemistry to create surface‑protecting solutions for healthcare, consumer, and industrial markets, aiming to
  reduce reliance on traditional antibiotics. Founded in 2018 as Halomine, AvantGuard has secured multiple NIH grants and a $1.7 M seed round
  to advance its decolonization platform.

